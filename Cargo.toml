[package]
name = "netnode"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Host several virtual IP/MAC endpoints with configurable delays on one Ethernet port"

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
etherparse = "0.21.0"
humantime = "2.4.0"
libc = "0.2.191"
rand = "0.10.3"
rustyline = "19.0.0"
serde = { version = "1.0.229", features = ["derive"] }
shlex = "2.0.1"
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
